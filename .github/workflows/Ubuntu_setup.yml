# Workflow is triggered on label and check installation on various operating systems
# This action is adapted from https://github.com/t4d-gmbh/stubbed_versioning
name: Ubuntu Install

on:
  push:
    branches:
      - "main"
      - "fix-ubuntu-install"

env:
  BRANCH: ${{ github.head_ref || github.ref_name }}

permissions:
  packages: read
  contents: write
  pull-requests: write
  repository-projects: write

jobs:
  setup-and-install:
    runs-on: ubuntu-latest
    name: ubuntu-latest R release
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      RENV_CONFIG_AUTOLOADER_ENABLED: 'false'

    steps:

      - name: Update package lists
        run: sudo apt-get update -y

      - name: install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      - name: install config and build dependencies
        run: |
          sudo apt-get -y install libcurl4-openssl-dev  # needed for pak
          sudo apt-get -y install graphviz libgraphviz-dev  # needed for Rgraphviz

      - name: install pak
        run: |
          install.packages(
            c("pak", "BiocManager"),
            repos = c(CRAN = "https://cran.r-project.org")
          )
        shell: Rscript {0}

      - name: install Bioconductor dependencies
        run: |
          BiocManager::install(
            c("graph", "Rgraphviz"),
            ask = FALSE,
            update = FALSE
          )
        shell: Rscript {0}

      # - name: install from CRAN with pak
      #   run: |
      #     pak::pkg_install('abn', dependencies=TRUE)
      #     library('abn')
      #   shell: Rscript {0}


      - name: show R and pak repository configuration
        run: |
          cat("R version:\n"); print(R.version.string)
          cat("session info:\n"); print(sessionInfo())
          cat("repos option:\n"); print(getOption("repos"))
          cat("RSPM env:\n"); print(Sys.getenv(c("RSPM", "RENV_CONFIG_REPOS_OVERRIDE")))
          cat("pak cache env:\n"); print(Sys.getenv(c("R_PKG_CACHE_DIR", "R_USER_CACHE_DIR")))
          cat("pak version:\n"); print(packageVersion("pak"))
          cat("pak repos:\n"); print(pak::repo_get())
        shell: Rscript {0}

      - name: update pak metadata with low concurrency
        run: |
          pak::repo_add(INLA = "https://inla.r-inla-download.org/R/stable/")
          options(
            async_http_total_con = 1,
            async_http_host_con = 1,
            async_http_multiplex = FALSE
          )

          ok <- FALSE
          for (i in 1:3) {
            ok <- tryCatch(
              {
                pak::meta_update()
                TRUE
              },
              error = function(e) {
                cat(
                  "metadata update attempt", i, "failed:",
                  conditionMessage(e), "\n"
                )
                FALSE
              }
            )
            if (ok) break
            if (i < 3) Sys.sleep(30 * i)
          }
          if (!ok) stop("pak metadata update failed after 3 attempts")
        shell: Rscript {0}

      - name: pak install from GitHub
        run: |
          pak::repo_add(INLA = "https://inla.r-inla-download.org/R/stable/")
          pak::pkg_install("furrer-lab/abn@${{ env.BRANCH }}", dependencies=TRUE)
          library('abn')
        shell: Rscript {0}

      - name: inspect pak metadata cache
        if: failure()
        run: |
          pak::repo_add(INLA = "https://inla.r-inla-download.org/R/stable/")
          repos <- pak::repo_get()
          repo_urls <- setNames(repos$url, repos$name)
          cat("repositories:\n")
          print(repos)

          replica <- "/tmp/pak-replica"
          unlink(replica, recursive = TRUE)
          dir.create(replica, recursive = TRUE)

          cfg <- pkgdepends::current_config()
          cmc <- pkgcache::cranlike_metadata_cache$new(
            primary_path = "/tmp/pak-primary",
            replica_path = replica,
            platforms = cfg$get("platforms"),
            r_version = cfg$get("r_versions"),
            bioc = FALSE,
            cran_mirror = repo_urls[["CRAN"]],
            repos = repo_urls
          )

          err <- tryCatch(
            {
              cmc$update()
              NULL
            },
            error = function(e) e
          )
          if (!is.null(err)) {
            cat("UPDATE ERROR:", conditionMessage(err), "\n")
          }

          for (f in list.files(replica, recursive = TRUE, full.names = TRUE)) {
            cat("FILE:", f, "\n")
            if (grepl("PACKAGES", basename(f))) {
              con <- file(f, "rb")
              magic <- readBin(con, "raw", 2)
              close(con)
              first <- if (
                length(magic) == 2 &&
                  magic[1] == as.raw(0x1f) &&
                  magic[2] == as.raw(0x8b)
              ) {
                con <- gzfile(f, "rt")
                x <- readLines(con, n = 1)
                close(con)
                x
              } else {
                readLines(f, n = 1, warn = FALSE)
              }
              cat("FIRST:", first, "\n")
            }
          }
        shell: Rscript {0}

      - name: fetch the repository from GitHub
        uses: actions/checkout@v4

      - name: install from source
        run: |
            pak::repo_add(INLA = "https://inla.r-inla-download.org/R/stable/")
            options(pkg.metadata_cache_dir = "/tmp/pak-metadata")
            pak::local_install(dependencies=TRUE, upgrade=FALSE)
        shell: Rscript {0}
